name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish WarLikeOSW.csproj -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: WarLike-OSW-Windows-x64
          path: publish/
          if-no-files-found: error
